# Port 80 on host maps to 8080 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 8080;
    server_name ingest-board.dev.sennetconsortium.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 on host maps to 4430 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 4430 ssl; # managed by Certbot
    server_name ingest-board.dev.sennetconsortium.org;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/ingest-board.dev.sennetconsortium.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ingest-board.dev.sennetconsortium.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Logging to the mounted volume for outside container access
    access_log /usr/src/app/log/nginx_access_data-ingest-board.log;
    error_log /usr/src/app/log/nginx_error_data-ingest-board.log warn;

    # Set file upload size limit (1M is the default)
    client_max_body_size 1M;

    # Add basic security headers
    # See https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Frame-Options "DENY" always;

    # No auth_request for favicon
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # The data ingest board is public, no auth_request here. Pass everything to the Next.js server on port 3000
    # See https://nextjs.org/docs/pages/guides/self-hosting
    location / {
        proxy_pass http://data-ingest-board:3000;

        # Pass the original client values to Next.js (for redirects, absolute urls)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
