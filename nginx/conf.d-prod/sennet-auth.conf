# Define the upstream sennet-auth-server to be used by other API (on the same machine) nginx configs
# This server will be accessed via `http://sennet-auth-server/api_auth` in other conf files
# We have to run the sennet-auth service on a different local port to be used by other APIs
# when deployed with multiple sub-domains pointing to the same machine with same IP
upstream sennet-auth-server {
    # IP v4 127.0.0.1 instead of localhost to avoid IPv6 resolution issues
    server 127.0.0.1:8000;
    keepalive 16;
}

# Catch-all for unknown hosts (only one default_server per port across all confs)
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 4430 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Port 80 on host maps to 8080 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 8080;
    server_name gateway.sennetconsortium.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 on host maps to 4430 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 4430 ssl; # managed by Certbot
    server_name gateway.sennetconsortium.org;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/gateway.sennetconsortium.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gateway.sennetconsortium.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Logging to the mounted volume for outside container access
    # Use the upstream_log log_format defined in the main nginx.conf for better debugging
    access_log /usr/src/app/log/nginx_access_gateway.log upstream_log;
    error_log /usr/src/app/log/nginx_error_gateway.log warn;

    # Enforce HTTP Strict Transport Security for all HTTPS responses
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # Pass requests to the uWSGI server using the "uwsgi" protocol on port 5000
    location / {
        # Always enable CORS
        # Response to preflight requests
        if ($request_method = 'OPTIONS') {
            # The directive `add_header` doesn't work when response status code is 401, 403 or 500
            # The `always` parameter is specified so the header field will be added regardless of the response code
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;

            # Custom headers and headers various browsers should be OK with but aren't
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Authorization,MAuthorization,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

            # Cache the response to this preflight request in browser for 24 hours (86400 seconds)
            # without sending another preflight request
            add_header 'Access-Control-Max-Age' 86400 always;

            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 204;
        }

        # Response to the original requests (HTTP methods are case-sensitive) with CORS enabled
        if ($request_method ~ (POST|GET|PUT|DELETE)) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Authorization,MAuthorization,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        include uwsgi_params;
        # Use IP v4 127.0.0.1 instead of localhost to avoid 502 error caused by DNS failure
        uwsgi_pass uwsgi://127.0.0.1:5000;

        # Maximum time nginx will wait to establish a connection to the uwsgi upstream before giving up
        uwsgi_connect_timeout 10s;
        # Maximum time nginx will wait between successive writes to uwsgi when sending a request
        uwsgi_send_timeout    90s;
        # Maximum time nginx will wait for uwsgi to send a response, preventing premature 502/504 errors on legitimately slow requests
        uwsgi_read_timeout    90s;
        # Size of the buffer used to read the first part of the uwsgi response header
        uwsgi_buffer_size 32k;
        # Number and size of buffers used for reading the uwsgi response body, reducing disk buffering warnings for larger responses
        uwsgi_buffers 4 32k;
    }
}

# Port 8443 on host maps to 8443 on container
# Port 8443 is used by ingest-api on another machine for auth_request
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 8443 ssl; # managed by Certbot
    server_name gateway.sennetconsortium.org;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/gateway.sennetconsortium.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gateway.sennetconsortium.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Logging to the mounted volume for outside container access
    # Use the upstream_log log_format defined in the main nginx.conf for better debugging
    access_log /usr/src/app/log/nginx_access_gateway_for_ingest-api_and_assets.log upstream_log;
    error_log /usr/src/app/log/nginx_error_gateway_for_ingest-api_and_assets.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # Pass requests to the uWSGI server using the "uwsgi" protocol on port 5000
    location / {
        include uwsgi_params;
        # Use IP v4 127.0.0.1 instead of localhost to avoid 502 error caused by DNS failure
        uwsgi_pass uwsgi://127.0.0.1:5000;

        # Maximum time nginx will wait to establish a connection to the uwsgi upstream before giving up
        uwsgi_connect_timeout 10s;
        # Maximum time nginx will wait between successive writes to uwsgi when sending a request
        uwsgi_send_timeout    90s;
        # Maximum time nginx will wait for uwsgi to send a response, preventing premature 502/504 errors on legitimately slow requests
        uwsgi_read_timeout    90s;
        # Size of the buffer used to read the first part of the uwsgi response header
        uwsgi_buffer_size 32k;
        # Number and size of buffers used for reading the uwsgi response body, reducing disk buffering warnings for larger responses
        uwsgi_buffers 4 32k;
    }
}

# sennet-auth service
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    # Bound to loopback so it can't be exposed by a port-mapping change
    listen 127.0.0.1:8000;

    server_name localhost;
    root /usr/share/nginx/html;

    # We need this logging for inspecting auth requests from other internal services
    # Logging to the mounted volume for outside container access
    access_log /usr/src/app/log/nginx_access_sennet-auth-server.log;
    error_log /usr/src/app/log/nginx_error_sennet-auth-server.log warn;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # Pass requests to the uWSGI server using the "uwsgi" protocol on port 5000
    location / {
        include uwsgi_params;
        # Use IP v4 127.0.0.1 instead of localhost to avoid 502 error caused by DNS failure
        uwsgi_pass uwsgi://127.0.0.1:5000;

        # Maximum time nginx will wait to establish a connection to the uwsgi upstream before giving up
        uwsgi_connect_timeout 10s;
        # Maximum time nginx will wait between successive writes to uwsgi when sending a request
        uwsgi_send_timeout    90s;
        # Maximum time nginx will wait for uwsgi to send a response, preventing premature 502/504 errors on legitimately slow requests
        uwsgi_read_timeout    90s;
        # Size of the buffer used to read the first part of the uwsgi response header
        uwsgi_buffer_size 32k;
        # Number and size of buffers used for reading the uwsgi response body, reducing disk buffering warnings for larger responses
        uwsgi_buffers 4 32k;
    }
}
