# Port 80 on host maps to 8080 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 8080;
    server_name entity.api.sennetconsortium.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 on host maps to 4430 on container
server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user codcc
    listen 4430 ssl; # managed by Certbot
    server_name entity.api.sennetconsortium.org;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/entity.api.sennetconsortium.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/entity.api.sennetconsortium.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Logging to the mounted volume for outside container access
    # Use the upstream_log log_format defined in the main nginx.conf for better debugging
    access_log /usr/src/app/log/nginx_access_entity-api.log upstream_log;
    error_log /usr/src/app/log/nginx_error_entity-api.log warn;

    # Set file upload size limit to 100M, default is 1M.
    client_max_body_size 100M;

    # Add HSTS header
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No auth_request for favicon
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    # Exact request URI matching
    location = /api_auth {
        internal;
        # Upstream sennet-auth server
        # The `sennet-auth-server` upstream is defined in `sennet-auth.conf`
        # We can specify the endpoint `api_auth` here but not in the upstream definition
        proxy_pass http://sennet-auth-server/api_auth;

        # Required for upstream keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Fail fast if the auth service is down or hanging
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        # No need to send the POST body
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Request-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;

        # Here we use $http_host in case the API is listening on a port other than 80.
        # Because $http_host = $host:$port
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        # Always enable CORS
        # Response to preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;

            # These are permitted headers to be used with the actual request
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Authorization,MAuthorization,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

            # Cache the response to this preflight request in browser for the max age 86400 seconds (= 24 hours)
            add_header 'Access-Control-Max-Age' 86400 always;

            add_header Strict-Transport-Security "max-age=31536000" always;

            # No Content
            return 204;
        }

        # Response to the original requests (HTTP methods are case-sensitive) with CORS enabled
        if ($request_method ~ (POST|GET|PUT|DELETE)) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Authorization,MAuthorization,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Send all requests to the '/api_auth' endpoint for authentication and authorization
        auth_request /api_auth;

        # Once authenticated/authorized, pass requests to the uWSGI server using the "uwsgi" protocol on port 5000
        include uwsgi_params;
        uwsgi_pass uwsgi://entity-api:5000;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_param UWSGI_SCHEME $scheme;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }
}
